services:
  db:
    image: mysql:8.0
    container_name: class-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
    container_name: class-backend
    ports:
      - "5001:5001"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      EMAILJS_SERVICE_ID: ${VITE_EMAILJS_SERVICE_ID:-}
      EMAILJS_TEMPLATE_ID: ${VITE_EMAILJS_TEMPLATE_ID:-}
      EMAILJS_PUBLIC_KEY: ${VITE_EMAILJS_PUBLIC_KEY:-}
      EMAILJS_PASSWORD_TEMPLATE_ID: ${EMAILJS_PASSWORD_TEMPLATE_ID:-}
      EMAILJS_REMINDER_TEMPLATE_ID: ${EMAILJS_REMINDER_TEMPLATE_ID:-}
      EMAILJS_TEST_RECIPIENT: ${VITE_EMAILJS_TEST_RECIPIENT:-}
      REMINDER_TEST_MODE: ${REMINDER_TEST_MODE:-true}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    volumes:
      - ./backend:/app/backend   # live code reloading during development
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
